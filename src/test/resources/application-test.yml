spring:
  datasource:
    url: jdbc:h2:mem:idempotency-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

app:
  idempotency:
    store: memory
    processing-ttl: 200ms
    completed-ttl: 24h
  redisson:
    enabled: false
